name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: polymarket
          POSTGRES_PASSWORD: polymarket
          POSTGRES_DB: polymarket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polymarket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run migrations against Postgres
        env:
          DATABASE_URL_SYNC: postgresql+psycopg2://polymarket:polymarket@localhost:5432/polymarket
        run: alembic upgrade head

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing
